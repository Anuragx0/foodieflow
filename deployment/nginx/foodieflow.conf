# FoodieFlow - Nginx Production Reverse Proxy Configuration for Amazon EC2
# Place in /etc/nginx/sites-available/foodieflow.conf
# Enable via: ln -s /etc/nginx/sites-available/foodieflow.conf /etc/nginx/sites-enabled/

# Rate limiting zone for cafeteria rush hours (10 req/sec per IP, burst of 20)
limit_req_zone $binary_remote_addr zone=foodieflow_api_limit:10m rate=10r/s;

upstream uvicorn_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ 3.106.6.89 api.foodieflow.campus.edu;

    # Redirect HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    client_max_body_size 10M;

    # Gzip Compression for peak network efficiency
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # FastAPI API and Webhooks
    location /api/ {
        limit_req zone=foodieflow_api_limit burst=20 nodelay;

        proxy_pass http://uvicorn_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Swagger / OpenAPI Interactive Documentation
    location /docs {
        proxy_pass http://uvicorn_backend/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://uvicorn_backend/openapi.json;
        proxy_set_header Host $host;
    }

    # Health Check Endpoint
    location /health {
        proxy_pass http://uvicorn_backend/api/health;
        access_log off;
    }
}
